[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emccd-denoising"
version = "1.0.0"
description = "Physics-based EMCCD noise modeling and Uformer denoising"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6",
  "scipy>=1.10",
  "scikit-image>=0.20",
  "tifffile>=2023.7",
  "torch>=2.1",
  "einops>=0.6",
  "timm>=0.9,<2",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
benchmark = ["lpips==0.1.4", "torchvision>=0.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
